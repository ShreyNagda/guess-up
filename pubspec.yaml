name: "guess_up"
description: "Guess Up is a mobile-based charades party game, designed especially for Indian youths and audiences. Put your phone on your forehead and guess the word based on your friends' clues!"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  sensors_plus: ^6.1.1
  timer_controller: ^1.0.0
  audioplayers: ^6.4.0
  wakelock_plus: ^1.3.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  connectivity_plus: ^7.0.0
  provider: ^6.1.5+1
  vibration: ^3.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo.png"
  adaptive_icon_background: "#ffffff"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data.json
    - assets/sounds/
    - assets/images/
