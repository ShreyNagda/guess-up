name: "guess_up"
description: "Guess Up is a mobile-based charades party game, designed especially for Indian youths and audiences. Put your phone on your forehead and guess the word based on your friends' clues!"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.13.0
  cloud_firestore: ^5.6.7
  sensors_plus: ^6.1.1
  timer_controller: ^1.0.0
  audioplayers: ^6.4.0
  wakelock_plus: ^1.3.2
  shared_preferences: ^2.5.3
  google_fonts: ^6.3.2
  connectivity_plus: ^7.0.0
  provider: ^6.1.5+1
  vibration: ^3.1.4
  flutter_native_splash: ^2.4.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/images/logo.png"
  adaptive_icon_foreground: "assets/images/logo-transparent.png"
  adaptive_icon_background: "#121212"

flutter_native_splash:
  color: "#ffffff"
  color_dark: "#000000"
  image: "assets/images/logo-transparent.png"
  image_dark: "assets/images/logo-transparent.png"
  android_gravity: center
  android_12:
    image: "assets/images/logo-transparent.png"
    image_dark: "assets/images/logo-transparent.png"
    icon_background_color: "#ffffff"
    icon_background_color_dark: "#000000"

flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/data.json
    - assets/sounds/
    - assets/images/
    - assets/images/onboarding/
    - assets/fonts/Manrope/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/Manrope-ExtraBold.ttf
          weight: 800
